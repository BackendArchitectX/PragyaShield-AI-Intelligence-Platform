services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_AI_PROVIDER: mock
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    ports:
      - "4200:4200"
    depends_on:
      - backend
